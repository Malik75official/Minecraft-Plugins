name: ServerSystem
version: 1.9.4
main: de.malik.serversystem.ServerSystemBootstrap
api-version: '26.2'
author: Malik75
description: Server-System mit Economy, Homes, Warps, Moderation und Case-Opening

commands:
  balance:
    description: Zeigt dein Guthaben oder das eines Spielers.
    usage: /balance [Spieler]
    aliases: [bal, money]
    permission: serversystem.command.balance
  pay:
    description: Überweist Geld an einen Spieler.
    usage: /pay <Spieler> <Betrag>
    permission: serversystem.command.pay
  payall:
    description: Zahlt allen Online-Spielern einen Betrag aus.
    usage: /payall <Betrag>
    permission: serversystem.command.payall
  eco:
    description: Verwaltet Spielerguthaben.
    usage: /eco <set|add|take> <Spieler> <Betrag>
    permission: serversystem.command.eco
  bank:
    description: Öffnet dein Bankkonto.
    usage: /bank [admin|npc]
    permission: serversystem.command.bank
  banknpc:
    description: Platziert den Bank-NPC an deiner Position.
    usage: /banknpc
    permission: serversystem.command.bank.npc
  sethome:
    description: Speichert dein Home.
    usage: /sethome [Name]
    permission: serversystem.command.sethome
  home:
    description: Teleportiert dich zu deinem Home.
    usage: /home [Name]
    permission: serversystem.command.home
  delhome:
    description: Löscht eines deiner Homes.
    usage: /delhome <Name>
    permission: serversystem.command.delhome
  homes:
    description: Listet deine Homes auf.
    usage: /homes
    permission: serversystem.command.homes
  setwarp:
    description: Erstellt einen Warp an deinem Standort.
    usage: /setwarp <Name>
    permission: serversystem.command.setwarp
  warp:
    description: Teleportiert dich zu einem Warp.
    usage: /warp <Name>
    permission: serversystem.command.warp
  delwarp:
    description: Entfernt einen Warp.
    usage: /delwarp <Name>
    permission: serversystem.command.delwarp
  farmwelt:
    description: Verbindet dich mit dem konfigurierten Farmwelt-Server.
    usage: /farmwelt
    permission: serversystem.command.farmwelt
  discord:
    description: Zeigt den Discord-Link.
    usage: /discord
    permission: serversystem.command.discord
  webseite:
    description: Zeigt den Webseiten-Link.
    usage: /webseite
    aliases: [website, web]
    permission: serversystem.command.webseite
  webshop:
    description: Zeigt den Webshop-Link.
    usage: /webshop
    permission: serversystem.command.webshop
  setspawn:
    description: Setzt den Server-Spawn.
    usage: /setspawn
    permission: serversystem.command.setspawn
  spawn:
    description: Teleportiert dich zum Server-Spawn.
    usage: /spawn
    permission: serversystem.command.spawn
  ec:
    description: Öffnet deine Enderchest.
    usage: /ec
    aliases: [enderchest]
    permission: serversystem.command.ec
  craft:
    description: Öffnet eine Werkbank.
    usage: /craft
    aliases: [workbench]
    permission: serversystem.command.craft
  amboss:
    description: Öffnet einen Amboss.
    usage: /amboss
    aliases: [anvil]
    permission: serversystem.command.amboss
  ofen:
    description: Öffnet einen Ofen.
    usage: /ofen
    aliases: [furnace]
    permission: serversystem.command.ofen
  fly:
    description: Schaltet Fliegen für dich oder einen Spieler um.
    usage: /fly [Spieler]
  i:
    description: Gibt dir ein Item (Ersatz für /give).
    usage: /i <Item> [Menge]
  vanish:
    description: Schaltet Unsichtbarkeit inklusive Nametag um.
    usage: /vanish
  gamemode:
    description: Ändert deinen Spielmodus oder den eines Spielers.
    usage: /gamemode <0|1|2|3|Modus> [Spieler]
    aliases: [gm]
  tp:
    description: Teleportiert dich oder einen Spieler.
    usage: /tp <Spieler> [Ziel]
  tpo:
    description: Teleportiert ohne Anfrage.
    usage: /tpo <Spieler> [Ziel]
  tphere:
    description: Teleportiert einen Spieler zu dir.
    usage: /tphere <Spieler>
  tpa:
    description: Sendet eine Teleportanfrage.
    usage: /tpa <Spieler>
  tpahere:
    description: Bittet einen Spieler, sich zu dir zu teleportieren.
    usage: /tpahere <Spieler>
  tpaccept:
    description: Nimmt eine Teleportanfrage an.
    usage: /tpaccept [Spieler]
  tpadeny:
    description: Lehnt eine Teleportanfrage ab.
    usage: /tpadeny [Spieler]
  tpacancel:
    description: Zieht deine Teleportanfrage zurück.
    usage: /tpacancel
  invsee:
    description: Öffnet das Inventar eines Spielers.
    usage: /invsee <Spieler>
  lockchest:
    description: Sperrt oder entsperrt eine anvisierte Kiste.
    usage: /lockchest
  trade:
    description: Handel mit einem Spieler.
    usage: /trade <accept|cancel|money>
    permission: serversystem.command.trade
  nick:
    description: Setzt deinen Nicknamen.
    usage: /nick <Name|off>
    permission: serversystem.command.nick
  kick:
    description: Wirft einen Spieler vom Server.
    usage: /kick <Spieler> [Grund]
    permission: serversystem.command.kick
  ban:
    description: Bannt einen online befindlichen Spieler für eine Dauer oder permanent.
    usage: /ban <Spieler> <Dauer|perma> <Grund>
    permission: serversystem.command.ban
  unban:
    description: Hebt einen Bann auf.
    usage: /unban <Spieler>
    permission: serversystem.command.unban
  mute:
    description: Stummschaltet einen Spieler.
    usage: /mute <Spieler> [Dauer] [Grund]
    permission: serversystem.command.mute
  unmute:
    description: Hebt eine Stummschaltung auf.
    usage: /unmute <Spieler>
    permission: serversystem.command.unmute
  case:
    description: Öffnet die Kisten-Auswahl oder verwaltet Kisten
    usage: /case [admin|give|setprice|reload|list]
  case-set:
    description: Markiert eine Kiste, ein Barrel oder eine Enderchest als Case-Block
    usage: /case-set
    permission: caseopening.admin
    permission-message: §cDu hast keine Admin-Berechtigung.
  case-clear:
    description: Entfernt die Case-Markierung von Kiste, Barrel oder Enderchest
    usage: /case-clear
    permission: caseopening.admin
    permission-message: §cDu hast keine Admin-Berechtigung.
  kristall:
    description: Zeigt das Kristall-Guthaben oder verwaltet Kristalle
    usage: /kristall [give|set|balance]
    permission: caseopening.kristalle.guthaben
    permission-message: §cDu hast keine Berechtigung für Kristall-Befehle.
  crystals:
    description: Alias für /kristall
    usage: /crystals [give|set|balance]
    permission: caseopening.kristalle.guthaben
    permission-message: §cDu hast keine Berechtigung für Kristall-Befehle.
  mobspawn:
    description: Spawnt ein Tier oder einen Mob auf einem festgelegten Level.
    usage: /mobspawn <mob> <level> [spieler]
    aliases: [ms]

