# Prefix-IDs von höchster zu niedrigster Priorität.
priority:
  - owner
  - developer
  - premium
  - spieler

# MiniMessage-Tags: https://docs.advntr.dev/minimessage/format.html
chat-format: "<prefix> <player><dark_gray>: <message>"
tab-format: "<prefix> <player>"
nametag-format: "<prefix> "

prefixes:
  owner:
    permission: prefix.owner
    text: "<dark_red>[Owner]</dark_red>"
    name-color: "<red>"
  developer:
    permission: prefix.developer
    text: "<dark_aqua>[Developer]</dark_aqua>"
    name-color: "<aqua>"
  premium:
    permission: prefix.premium
    text: "<gold>[Premium]</gold>"
    name-color: "<yellow>"
  spieler:
    permission: prefix.spieler
    text: "<gray>[Spieler]</gray>"
    name-color: "<white>"