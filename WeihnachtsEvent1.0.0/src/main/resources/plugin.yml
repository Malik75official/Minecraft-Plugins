name: WeihnachtsEvent
version: '${version}'
main: de.skyfunity.weihnachten.WeihnachtsPlugin
api-version: '26.2'
description: Weihnachts-Event mit Adventskalender, Cookies und Quests.
softdepend: [Citizens]
commands:
  weihnachtsnpc:
    description: Setzt den Adventskalender-NPC.
    permission: Weihnachten.npc
  cookieshop:
    description: Öffnet den Cookie-Shop.
  cookieshop-admin:
    description: Verwaltet den Cookie-Shop.
    permission: Weihnachten.admin
  whead:
    description: Registriert einen Weihnachtskopf.
    permission: Weihnachten.admin
  gift:
    description: Schenkt Cookies.
  wquests:
    description: Zeigt Quests und Fortschritt.
  cookies:
    description: Zeigt deine Cookies.
  cookie-admin:
    description: Verwaltet Cookies.
    permission: Weihnachten.admin
permissions:
  Weihnachten.npc:
    default: op
  Weihnachten.admin:
    default: op